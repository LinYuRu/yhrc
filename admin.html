<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>永和慢跑 - 管理員後台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary-color: #0d6efd; }
        body { background-color: #f8f9fa; font-family: "Microsoft JhengHei", sans-serif; }

        #login-section { min-height: 80vh; display: flex; align-items: center; }
        .container { max-width: 950px; }

        .post-card {
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            border-left: 5px solid var(--primary-color);
        }
        .post-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important;
        }

        .category-badge { font-size: 0.75rem; padding: 0.3em 0.8em; border-radius: 50px; }
        .bg-general { background-color: #e9ecef; color: #495057; }
        .bg-event { background-color: #cfe2ff; color: #084298; }
        .bg-member { background-color: #d1e7dd; color: #0f5132; }
        .bg-rules { background-color: #fff3cd; color: #664d03; }

        #admin-content { display: none; margin-top: 40px; margin-bottom: 60px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-section">
        <div class="card p-4 shadow-sm mx-auto w-100" style="max-width: 400px;">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-block p-3 mb-2">
                    <i class="bi bi-person-lock fs-2"></i>
                </div>
                <h3>管理員登入</h3>
                <p class="text-muted small">請輸入憑證以進入永和慢跑後台</p>
            </div>
            <div class="mb-3">
                <label class="form-label small">Email</label>
                <input type="email" id="email" class="form-control" placeholder="admin@example.com">
            </div>
            <div class="mb-4">
                <label class="form-label small">密碼</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••">
            </div>
            <button onclick="handleLogin()" class="btn btn-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> 進入後台
            </button>
        </div>
    </div>

    <div id="admin-content">
        <ul class="nav nav-tabs mb-4" id="adminTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="posts-tab" data-bs-toggle="tab" data-bs-target="#posts-panel" type="button">
                    <i class="bi bi-megaphone me-1"></i> 公告管理
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="members-tab" data-bs-toggle="tab" data-bs-target="#members-panel" type="button">
                    <i class="bi bi-people me-1"></i> 會員管理
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="activities-tab" data-bs-toggle="tab" data-bs-target="#activities-panel" type="button">
                    <i class="bi bi-calendar-event me-1"></i> 活動管理
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold text-danger" id="record-tab" data-bs-toggle="tab" data-bs-target="#attendance-panel" type="button">
                    <i class="bi bi-check2-square me-1"></i> 出席點名紀錄
                </button>
            </li>
            <li class="page-item nav-item">
                <button class="nav-link" id="attendance-tab" data-bs-toggle="tab" data-bs-target="#cat-attendance" type="button" role="tab" aria-controls="cat-attendance" aria-selected="false">
                    <i class="bi bi-calendar-check me-2"></i>出席紀錄報表
                </button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabContent">
            <div class="tab-pane fade show active" id="posts-panel" role="tabpanel">
                <div class="row align-items-center mb-4">
                    <div class="col">
                        <h4 class="fw-bold mb-0">最新公告列表</h4>
                    </div>
                    <div class="row g-2 mb-4 align-items-center bg-light p-3 rounded shadow-sm">
                        <div class="col-md-3">
                            <label class="form-label small fw-bold text-muted mb-1">公告年份</label>
                            <select id="filter-year" class="form-select" onchange="filterPosts()">
                                <option value="all">全部年份</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold text-muted mb-1">公告類別</label>
                            <select id="filter-category" class="form-select" onchange="filterPosts()">
                                <option value="all">全部類別</option>
                                <option value="general">一般公告</option>
                                <option value="event">活動訊息</option>
                                <option value="member">會員專區</option>
                                <option value="rules">理監事會議紀錄</option>
                            </select>
                        </div>
                        <div class="col text-md-end mt-3 mt-md-0">
                            <!--                            <button class="btn btn-dark px-4" onclick="openAddModal()">-->
                            <button onclick="openAddModal()" class="btn btn-success shadow-sm">
                                <i class="bi bi-plus-lg me-1"></i> 新增公告
                            </button>
                        </div>
                    </div>

                </div>
                <div id="posts-list"></div>
            </div>
            
            <div class="tab-pane fade" id="members-panel" role="tabpanel">
                <div class="row align-items-center mb-4">
                    <div class="col">
                        <h4 class="fw-bold mb-0">會員資料庫</h4>
                    </div>
                    <div class="col-auto">
                        <select id="group-filter" class="form-select shadow-sm" style="min-width: 140px;">
                            <option value="all">全部組別</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <select id="category-filter" class="form-select shadow-sm" style="min-width: 160px;">
                            <option value="all">全部類別</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <select id="fee-year-filter" class="form-select shadow-sm" style="min-width: 160px;">
                            <option value="all">全部會費年份</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button onclick="openMemberModal()" class="btn btn-primary shadow-sm">
                            <i class="bi bi-person-plus me-1"></i> 新增會員
                        </button>
                    </div>
                </div>
                <div id="members-list"></div>
                <div class="d-flex justify-content-between align-items-center mt-3 px-2">
                    <div id="pagination-info" class="text-muted small">
                        顯示第 0 到 0 筆資料，共 0 筆
                    </div>
                    <nav aria-label="Member list pagination">
                        <ul class="pagination pagination-sm mb-0" id="pagination-controls">
                        </ul>
                    </nav>
                </div>
            </div>
            
            <div class="tab-pane fade" id="activities-panel" role="tabpanel">
                <div class="row align-items-center mb-4">
                    <div class="col">
                        <h4 class="fw-bold mb-0">活動賽事管理</h4>
                    </div>
                    <div class="col-auto">
                        <select id="type-filter" class="form-select shadow-sm" style="min-width: 140px;">
                            <option value="all">全部類型</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <select id="year-filter" class="form-select shadow-sm" style="min-width: 140px;">
                            <option value="all">全部年份</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button onclick="openActivityModal()" class="btn btn-warning shadow-sm fw-bold text-dark">
                            <i class="bi bi-calendar-plus me-1"></i> 新增活動
                        </button>
                    </div>
                </div>
                <div id="activities-list"></div>
            </div>

            <div class="tab-pane fade" id="attendance-panel" role="tabpanel">
                <div class="card shadow-sm border-0 p-4 bg-white mb-4">
                    <h4 class="fw-bold text-dark mb-3"><i class="bi bi-clipboard-check me-2 text-danger"></i>活動出席點名系統</h4>
                    <div class="row g-3 align-items-center mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">第一步：請選取目標活動</label>
                            <select id="attendance-activity-select" class="form-select form-select-lg border-primary" onchange="loadAttendanceSheet()">
                                <option value="">-- 請選擇活動 --</option>
                            </select>
                        </div>
                        <div class="col-md-6 text-md-end mt-4">
                            <button id="save-attendance-btn" onclick="submitAttendanceSheet()" class="btn btn-danger btn-lg px-4 shadow-sm" disabled>
                                <i class="bi bi-cloud-upload me-1"></i> 儲存本次點名紀錄
                            </button>
                        </div>
                    </div>

                    <hr>

                    <div id="attendance-sheet-container">
                        <p class="text-muted text-center py-5">請先於上方選擇一項活動以載入簽到名單。</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-5">
            <button onclick="handleLogout()" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-door-open me-1"></i> 登出管理系統
            </button>
        </div>
    </div>
</div>

<!--公告編輯頁面START-->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white py-3">
                <h5 class="modal-title fs-4" id="modalTitle">編輯公告</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="edit-id">
                <div class="mb-3">
                    <label class="form-label fs-5 fw-bold text-dark">公告種類</label>
                    <select id="edit-category" class="form-select form-select-lg">
                        <option value="general">一般公告</option>
                        <option value="event">活動訊息</option>
                        <option value="member">會員專區</option>
                        <option value="rules">理監事會議紀錄</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fs-5 fw-bold text-dark">標題</label>
                    <input type="text" id="edit-title" class="form-control form-control-lg" placeholder="例如：春季團練公告">
                </div>
                <div class="mb-0">
                    <label class="form-label fs-5 fw-bold text-dark">內容</label>
                    <textarea id="edit-text" class="form-control" rows="8" placeholder="支援 HTML 標籤..."></textarea>
                </div>
            </div>
            <div class="modal-footer bg-light py-3">
                <button type="button" class="btn btn-secondary btn-lg px-4" data-bs-dismiss="modal">取消</button>
                <button onclick="submitSave()" class="btn btn-primary btn-lg px-5" id="saveBtn">儲存</button>
            </div>
        </div>
    </div>
</div>
<!--公告編輯頁面END-->

<div class="modal fade" id="memberModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="memberModalTitle"><i class="bi bi-person-plus me-2"></i>新增會員資料</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="memberForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">姓名</label>
                            <input type="text" id="m-name" class="form-control" required placeholder="請輸入姓名">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">性別</label>
                            <select id="m-gender" class="form-select">
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">出生年月日</label>
                            <input type="date" id="m-birth_date" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">入會日期</label>
                            <input type="date" id="m-join_date" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">電話</label>
                            <input type="tel" id="m-phone" class="form-control" value="09" placeholder="0912-345678">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Email (登入/聯繫用)</label>
                            <input type="email" id="m-email" class="form-control" value="@gmail.com" placeholder="example@mail.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">會員類別</label>
                            <select id="m-category" class="form-select"></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">所屬組別</label>
                            <select id="m-group_number" class="form-select">
                                <option value="">請選擇組別</option>
                            </select>
                        </div>
                        <!-- 新增：組長 Checkbox 開關 -->
                        <div class="col-md-6 d-flex align-items-center">
                            <div class="form-check form-switch mt-4">
                                <input class="form-check-input" type="checkbox" id="m-is_lead">
                                <label class="form-check-label fw-bold text-primary" for="m-is_lead">指定為該組組長 (Lead)</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">通訊地址</label>
                            <input type="text" id="m-address" class="form-control" placeholder="請輸入完整地址">
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" id="m-is_student">
                                <label class="form-check-label fw-bold" for="m-is_student">具備學生身份</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" id="m-entrance_fee_paid">
                                <label class="form-check-label fw-bold" for="m-entrance_fee_paid">已繳納入會費 (1000元)</label>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-success">常年會費有效年份 (已繳至)</label>
                            <select id="m-annual_fee_paid_until" class="form-select border-success">
                                <option value="">未繳交/無紀錄</option>
                                <option value="9999">永久會員(無須繳費)</option>
                                <script>
                                    const y = new Date().getFullYear();
                                    document.write(`
                                        <option value="${y+1}">${y+1} 年份</option>
                                        <option value="${y}" selected>${y} 年份</option>
                                        <option value="${y-1}">${y-1} 年份</option>
                                    `);
                                </script>
                            </select>
                        </div>
                        <div class="col-12">
                            <div class="card border-info bg-light-subtle">
                                <div class="card-header bg-info text-white py-2 fw-bold">
                                    <i class="bi bi-shield-check me-2"></i>社團服裝裝備發放數量紀錄
                                </div>
                                <div class="card-body py-3">
                                    <div class="row g-3">
                                        <div class="col-md-4">
                                            <label class="form-label fw-bold">背心 (vest)</label>
                                            <input type="number" id="m-gear-vest" class="form-control" min="0" value="0" placeholder="發放數量">
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label fw-bold">長袖 (long_sleeve)</label>
                                            <input type="number" id="m-gear-long" class="form-control" min="0" value="0" placeholder="發放數量">
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label fw-bold">短袖 (short_sleeve)</label>
                                            <input type="number" id="m-gear-short" class="form-control" min="0" value="0" placeholder="發放數量">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button onclick="submitMember()" class="btn btn-primary px-4" id="memberSaveBtn">儲存會員</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="activityModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-md modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title fw-bold"><i class="bi bi-calendar-plus me-2"></i>新增活動賽事</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="activityForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">活動名稱 / 賽事名稱</label>
                        <input type="text" id="a-title" value="永福橋團練" class="form-control" required placeholder="例如：2026 金山馬拉松團報">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">活動日期</label>
                        <input type="date" id="a-activity_date" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">活動地點</label>
                        <input type="text" id="a-location" value="永福橋(台北側)" class="form-control" placeholder="例如：新北市金山區">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">活動類型</label>
                        <select id="a-activity_type" class="form-select">
                            <option value="團練">例行團練</option>
                            <option value="賽事">官方賽事 / 團報</option>
                            <option value="聚會">聯誼聚餐</option>
                            <option value="其他">其他活動</option>
                        </select>
                    </div>
                    <div class="mb-0">
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" id="a-is_locked">
                            <label class="form-check-label fw-bold" for="a-is_locked">鎖定活動 (禁止修改/報名)</label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button onclick="submitActivity()" class="btn btn-warning px-4 fw-bold text-dark" id="activitySaveBtn">儲存活動</button>
            </div>
        </div>
    </div>
</div>

<!--出席報表tab START-->
<div class="tab-pane fade" id="cat-attendance" role="tabpanel" aria-labelledby="attendance-tab">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 bg-light p-3 rounded border">
        <div class="row g-2 align-items-center flex-grow-1 me-md-2" style="max-width: 80%;">
            <div class="col-12 col-md-4">
                <input type="text" id="attendance-search" class="form-control" placeholder="搜尋姓名、活動名稱...">
            </div>
            <div class="col-4 col-md-2">
                <select id="attendance-year-filter" class="form-select">
                    <option value="all">全部年份</option>
                </select>
            </div>
            <div class="col-4 col-md-2">
                <select id="attendance-month-filter" class="form-select">
                    <option value="all">全部月份</option>
                </select>
            </div>
            <div class="col-4 col-md-2">
                <select id="attendance-group-filter" class="form-select">
                    <option value="all">全部組別</option>
                </select>
            </div>
        </div>
        
        <div class="d-flex gap-2">
            <button class="btn btn-outline-success" onclick="exportAttendanceCsv()">
                <i class="bi bi-file-earmark-spreadsheet me-1"></i>匯出報表
            </button>
            <button class="btn btn-primary" onclick="loadAttendanceReport()">
                <i class="bi bi-arrow-clockwise me-1"></i>重新整理
            </button>
        </div>
    </div>
    
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card border-start border-primary border-4 shadow-sm">
                <div class="card-body py-3">
                    <h6 class="card-subtitle text-muted mb-1 small fw-bold">本月應出席總人次</h6>
                    <h3 class="card-title mb-0 fw-bold text-primary" id="stat-total-expected">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-start border-success border-4 shadow-sm">
                <div class="card-body py-3">
                    <h6 class="card-subtitle text-muted mb-1 small fw-bold">實際出席人次 (出席率)</h6>
                    <h3 class="card-title mb-0 fw-bold text-success" id="stat-actual-attended">0 <span class="fs-6 fw-normal text-muted" id="stat-attendance-rate">(0%)</span></h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-start border-danger border-4 shadow-sm">
                <div class="card-body py-3">
                    <h6 class="card-subtitle text-muted mb-1 small fw-bold">請假 / 缺席人次</h6>
                    <h3 class="card-title mb-0 fw-bold text-danger" id="stat-total-absent">0</h3>
                </div>
            </div>
        </div>
    </div>
    
    <div class="table-responsive bg-white rounded shadow-sm border p-3">
        <table class="table table-hover align-middle" id="attendance-table">
            <thead class="table-light">
            <tr>

// 1. 載入原始公告資料
async function loadPosts() {

        return;
    }

    // 將資料暫存到全域變數中
    allPosts = data || [];
    
    // 智慧型動態建立年份下拉選單
    buildYearFilter();
    
    // 執行第一次的畫面過濾與渲染
    filterPosts();

// 2. 智慧型去重，動態建立年份下拉選單
function buildYearFilter() {
    const yearFilter = document.getElementById('filter-year');
    if (!yearFilter) return;

    // 儲存目前的選取值，避免重新整理清單時重置使用者的選取
    const currentSelected = yearFilter.value;

    // 從所有公告中提取 created_at 的年份
    const years = allPosts.map(post => {
        return new Date(post.created_at).getFullYear();
    });

    // 利用 Set 去除重複年份，並由大到小排序（例如 2026, 2025, 2024）
    const uniqueYears = [...new Set(years)].sort((a, b) => b - a);

    // 初始化下拉選單（保留全部年份）
    let optionsHtml = '<option value="all">全部年份</option>';
    uniqueYears.forEach(year => {
        optionsHtml += `<option value="${year}">${year} 年</option>`;
    });

    yearFilter.innerHTML = optionsHtml;

    // 還原使用者的選取值（如果該年份依然存在）
    if (uniqueYears.includes(parseInt(currentSelected))) {
        yearFilter.value = currentSelected;
    } else {
        yearFilter.value = "all";
    }
}

// 3. 多條件交叉過濾與 HTML 渲染
function filterPosts() {
    const listDiv = document.getElementById('posts-list');
    const selectedYear = document.getElementById('filter-year').value;
    const selectedCategory = document.getElementById('filter-category').value;

    // 進行交叉篩選
    const filtered = allPosts.filter(post => {
        const postYear = new Date(post.created_at).getFullYear().toString();
        const postCategory = post.category || 'general';

        const matchYear = (selectedYear === 'all' || postYear === selectedYear);
        const matchCategory = (selectedCategory === 'all' || postCategory === selectedCategory);

        return matchYear && matchCategory;
    });

    // 如果篩選後沒有任何資料
    if (filtered.length === 0) {
        listDiv.innerHTML = '<div class="text-center p-5 text-muted bg-white shadow-sm rounded">查無符合條件的公告資料。</div>';
        return;
    }

    // 開始渲染符合條件的資料
    listDiv.innerHTML = '';
    filtered.forEach(post => {
        // 為了避免 content 內文含有單引號、雙引號或換行造成 JS 傳參錯誤
        // 將 post 物件字串化，並將雙引號轉義，以便安全傳入 openEditModal
        const postStr = JSON.stringify(post).replace(/"/g, '&quot;');

        listDiv.innerHTML += `
            <div class="card post-card shadow-sm p-3 mb-3 bg-white">
                <div class="row align-items-center">
                    <div class="col">
                        <span class="category-badge bg-${post.category || 'general'} mb-2 d-inline-block">${catNames[post.category] || '未分類'}</span>
                        <h5 class="mb-1 fw-bold text-dark">${post.title}</h5>
                        <small class="text-muted"><i class="bi bi-clock me-1"></i>${new Date(post.created_at).toLocaleDateString()}</small>
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-outline-primary btn-sm me-1" onclick="openEditModalByStr('${postStr}')"><i class="bi bi-pencil"></i> 編輯</button>
                        <button class="btn btn-outline-danger btn-sm" onclick="handleDelete(${post.id})"><i class="bi bi-trash"></i> 刪除</button>
                    </div>
                </div>
            </div>`;
    });
}

// 優化後的編輯 Modal 開啟方式：透過完整物件避免字串換行與脫模錯誤
function openEditModalByStr(postStr) {
    let post;
    if (typeof postStr === 'string') {
        const safeStr = postStr.replace(/&quot;/g, '"').replace(/\n/g, '\\n').replace(/\r/g, '\\r');
        post = JSON.parse(safeStr);
    } else { post = postStr; }

    $('#modalTitle').text("編輯公告"); $('#saveBtn').text("儲存修改"); $('#edit-id').val(post.id);
    $('#edit-title').val(post.title); $('#edit-text').val(post.content || ""); $('#edit-category').val(post.category || "general");
    editModal.show();
}

async function loadMembers() {
   const { data, error } = await _supabase.from('vw_public_members').select('*');
   if (error) return;

   // 1. 動態更新「所有篩選下拉選單」的選項
   const $groupFilter = $('#group-filter');
   const currentSelectedGroup = $groupFilter.val() || 'all';
   const groupsSet = new Set();
   
   const $categoryFilter = $('#category-filter');
   const currentSelectedCategory = $categoryFilter.val() || 'all';
   const categoriesSet = new Set();

   const $feeYearFilter = $('#fee-year-filter');
   const currentSelectedYear = $feeYearFilter.val() || 'all';
   const feeYearsSet = new Set();

   $.each(data, function(index, m) {
      if (m.group_number !== null && m.group_number !== undefined) groupsSet.add(m.group_number);
      if (m.category) categoriesSet.add(m.category);
      if (m.annual_fee_paid_until) feeYearsSet.add(m.annual_fee_paid_until);
   });
   
   // A. 渲染組別選單
   const sortedGroups = Array.from(groupsSet).sort((a, b) => a - b);
   let groupSelectHtml = `<option value="all">全部組別</option>`;
   $.each(sortedGroups, function(index, g) {
      const groupText = (typeof groupMap !== 'undefined' && groupMap.has(String(g))) ? groupMap.get(String(g)) : g + '組';
      groupSelectHtml += `<option value="${g}">${groupText}</option>`;
   });
   groupSelectHtml += `<option value="none">未分組</option>`;
   $groupFilter.html(groupSelectHtml);
   if ($groupFilter.find(`option[value="${currentSelectedGroup}"]`).length > 0) $groupFilter.val(currentSelectedGroup);

   // B. 渲染類別選單
   const sortedCategories = Array.from(categoriesSet).sort((a, b) => {
      const textA = (typeof categoryMap !== 'undefined' && categoryMap.get(a)) || a;
      const textB = (typeof categoryMap !== 'undefined' && categoryMap.get(b)) || b;
      return textA.localeCompare(textB, 'zh-TW');
   });
   let categorySelectHtml = `<option value="all">全部類別</option>`;
   $.each(sortedCategories, function(index, c) {
      const categoryText = (typeof categoryMap !== 'undefined' && categoryMap.has(c)) ? categoryMap.get(c) : c;
      categorySelectHtml += `<option value="${c}">${categoryText}</option>`;
   });
   $categoryFilter.html(categorySelectHtml);
   if ($categoryFilter.find(`option[value="${currentSelectedCategory}"]`).length > 0) $categoryFilter.val(currentSelectedCategory);

   // C. 渲染會費年份選單
   const sortedYears = Array.from(feeYearsSet).sort((a, b) => b - a);
   let feeYearSelectHtml = `<option value="all">全部會費年份</option>`;
   $.each(sortedYears, function(index, y) {
      if (y === 9999) {
         feeYearSelectHtml += `<option value="9999">永久會員</option>`;
      } else {
         feeYearSelectHtml += `<option value="${y}">已繳至 ${y} 年</option>`;
      }
   });
   feeYearSelectHtml += `<option value="none">未繳費 / 已過期</option>`;
   $feeYearFilter.html(feeYearSelectHtml);
   if ($feeYearFilter.find(`option[value="${currentSelectedYear}"]`).length > 0) $feeYearFilter.val(currentSelectedYear);


   // 2. 進行前端資料「三條件聯合篩選過濾」
   let filteredData = data.filter(m => {
      const rowGroup = m.group_number !== null && m.group_number !== undefined ? String(m.group_number) : 'none';
      const rowCategory = m.category || 'none';
      const rowYear = m.annual_fee_paid_until ? String(m.annual_fee_paid_until) : 'none';

      const groupMatch = (currentSelectedGroup === 'all' || rowGroup === currentSelectedGroup);
      const categoryMatch = (currentSelectedCategory === 'all' || rowCategory === currentSelectedCategory);
      const feeYearMatch = (currentSelectedYear === 'all' || rowYear === currentSelectedYear);

      return groupMatch && categoryMatch && feeYearMatch;
   });


   // 3. 進行前端資料「欄位排序」
   filteredData.sort((a, b) => {
      let valA = a[currentSort.key];
      let valB = b[currentSort.key];

      if (currentSort.key === 'group_number') {
         if (valA === null || valA === undefined) return 1;
         if (valB === null || valB === undefined) return -1;
         return currentSort.asc ? valA - valB : valB - valA;
      }
      
      if (currentSort.key === 'category') {
         if (!valA) return 1;
         if (!valB) return -1;
         const textA = (typeof categoryMap !== 'undefined' && categoryMap.get(valA)) || valA;
         const textB = (typeof categoryMap !== 'undefined' && categoryMap.get(valB)) || valB;
         return currentSort.asc ? textA.localeCompare(textB, 'zh-TW') : textB.localeCompare(textA, 'zh-TW');
      }
      return 0;
   });


   // 4. 計算分頁範圍與資訊
   const totalRows = filteredData.length;
   const totalPages = Math.ceil(totalRows / rowsPerPage) || 1;
   
   if (currentPage > totalPages) currentPage = totalPages;
   if (currentPage < 1) currentPage = 1;

   const startIndex = (currentPage - 1) * rowsPerPage;
   const endIndex = Math.min(startIndex + rowsPerPage, totalRows);
   
   const pageData = filteredData.slice(startIndex, endIndex);

   if (totalRows === 0) {
      $('#pagination-info').text('查無符合條件的會員資料');
   } else {
      $('#pagination-info').text(`顯示第 ${startIndex + 1} 到 ${endIndex} 筆資料，共 ${totalRows} 筆`);
   }


   // 5. 渲染分頁按鈕 UI
   let paginationHtml = '';

      <a class="page-link change-page-btn" href="#" data-page="${currentPage - 1}">上一頁</a>
   </li>`;
   
   for (let i = 1; i <= totalPages; i++) {
      paginationHtml += `<li class="page-item ${currentPage === i ? 'active' : ''}">
         <a class="page-link change-page-btn" href="#" data-page="${i}">${i}</a>
      </li>`;
   }
   
   paginationHtml += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
      <a class="page-link change-page-btn" href="#" data-page="${currentPage + 1}">下一頁</a>
   </li>`;
   $('#pagination-controls').html(paginationHtml);


   // 6. 渲染表格結構 (加入「職務身分」欄位)
   const categorySortIcon = currentSort.key === 'category' ? (currentSort.asc ? ' ▲' : ' ▼') : '';
   const groupSortIcon = currentSort.key === 'group_number' ? (currentSort.asc ? ' ▲' : ' ▼') : '';

   let tableHtml = `
   <div class="table-responsive bg-white rounded shadow-sm border p-3">
      <table class="table table-hover align-middle">
         <thead>
            <tr>
               <th>姓名</th>
               <th>聯絡電話</th>
               <th class="sort-th text-primary" data-key="category" style="cursor: pointer; user-select: none;">類別<small>${categorySortIcon}</small></th>
               <th class="sort-th text-primary" data-key="group_number" style="cursor: pointer; user-select: none;">組別<small>${groupSortIcon}</small></th>
               <th>職務身分</th>
               <th>會費效期</th>
               <th>操作</th>
            </tr>
         </thead>
         <tbody>`;
         
   $.each(pageData, function(index, m) {
      const memberJson = JSON.stringify(m).replace(/'/g, "&apos;").replace(/"/g, "&quot;");
      const displayCategory = (typeof categoryMap !== 'undefined' && categoryMap.has(m.category)) ? categoryMap.get(m.category) : (m.category || '-');
      
      let displayGroup = '-';
      if (m.group_number !== null && m.group_number !== undefined) {
         displayGroup = (typeof groupMap !== 'undefined' && groupMap.has(String(m.group_number))) ? groupMap.get(String(m.group_number)) : m.group_number + '組';
      }

      // 判斷 is_lead 狀態來顯示組長或組員
      let leadBadge = '';
      if (m.is_lead) {
         leadBadge = `<span class="badge bg-warning text-dark border border-warning-subtle fw-bold">組長</span>`;
      } else {
         leadBadge = `<span class="badge bg-light text-secondary border">組員</span>`;
      }

      let displayYearBadge = '';
      if (m.annual_fee_paid_until === 9999) {

			// 儲存目前的篩選值，避免畫面重新整理後被重置

			// 1. 萃取現有的「不重複類型」與「不重複年份」
			const typesSet = new Set();
			const yearsSet = new Set();
		
			$.each(data, function(index, act) {
				if (act.activity_type) typesSet.add(act.activity_type);
				if (act.activity_date) {
					const year = act.activity_date.substring(0, 4); // 取出日期前 4 碼年份
					yearsSet.add(year);
				}
			});
		
			// 2. 動態生成【類型選單】
			let typeHtml = `<option value="all">全部類型</option>`;

			if (currentSelectedType && $typeFilter.find(`option[value="${currentSelectedType}"]`).length > 0) {
				$typeFilter.val(currentSelectedType);

			// 3. 動態生成【年份選單】(依年份由大到小排序)
			let yearHtml = `<option value="all">全部年份</option>`;
			const sortedYears = Array.from(yearsSet).sort((a, b) => b - a);
			$.each(sortedYears, function(index, y) {
				yearHtml += `<option value="${y}">${y} 年</option>`;
			});
			$yearFilter.html(yearHtml);
			if (currentSelectedYear && $yearFilter.find(`option[value="${currentSelectedYear}"]`).length > 0) {

    // 批次儲存點名結果
    async function submitAttendanceSheet() {
        const activityId = document.getElementById('attendance-activity-select').value;
        if (!activityId) return;

        const saveBtn = document.getElementById('save-attendance-btn');
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 儲存中...';

        const rows = document.querySelectorAll('.member-row');
        const upsertData = [];
        const deleteIds = [];

        rows.forEach(row => {
            const memberId = row.getAttribute('data-member-id');
            const selectedRadio = document.querySelector(`input[name="status-${memberId}"]:checked`);
            const status = selectedRadio ? selectedRadio.value : 'NotRegistered';
            const notes = document.getElementById(`notes-${memberId}`).value.trim();

            if (status === 'NotRegistered') {
                // 如果選擇「未參與」，代表該活動與該會員無關係，記錄存在則刪除
                deleteIds.push(memberId);
            } else {
                // 需要寫入或更新紀錄
                upsertData.push({
                    activity_id: activityId,
                    member_id: memberId,
                    status: status,
                    notes: notes || null
                });
            }
        });

        try {
            // 1. 執行刪除 (改選為未參與的成員)
            if (deleteIds.length > 0) {
                const { error: delErr } = await _supabase
                    .from('attendance')
                    .delete()
                    .eq('activity_id', activityId)
                    .in('member_id', deleteIds);
                if (delErr) throw delErr;
            }

            // 2. 執行 Upsert (有變更狀態的成員，因為設定了複合唯一限制 unique_member_activity，Supabase 會自動判定更新或新增)
            if (upsertData.length > 0) {
                const { error: upErr } = await _supabase
                    .from('attendance')
                    .upsert(upsertData, { onConflict: 'member_id,activity_id' });
                if (upErr) throw upErr;
            }

            alert('🎉 出席簽到點名紀錄已成功更新至雲端資料庫！');
            loadAttendanceSheet(); // 重新整理
        } catch (err) {
            alert('儲存失敗：' + err.message);
        } finally {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="bi bi-cloud-upload me-1"></i> 儲存本次點名紀錄';
        }
    }

/**
 * 2. 從 Supabase 讀取出席紀錄（含關聯成員與活動資料）
 */
async function loadAttendanceReport() {
    $('#attendance-list').html(`
        <tr>
            <td colspan="6" class="text-center text-muted py-4">
                <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                正在載入出席紀錄數據...
            </td>
        </tr>
    `);

    try {
        // 在這裡加上別名 (activities:vw_public_activities 與 members:vw_public_members)
        const { data, error } = await _supabase
            .from('vw_public_attendance')
            .select(`
                id,
                status,
                notes,
                created_at,
                activities:vw_public_activities (
                    title,
                    activity_date,
                    location,
                    activity_type
                ),
                members:vw_public_members (
                    name,
                    group_number,
                    category
                )
            `);

        if (error) throw error;

        // 將資料存入全域變數，並依照活動日期由新到舊排序
        rawAttendanceData = data || [];
        rawAttendanceData.sort((a, b) => {
            const dateA = a.activities?.activity_date || '';
            const dateB = b.activities?.activity_date || '';
            return dateB.localeCompare(dateA);
        });

        // 動態生成「年份」與「組別」與「月份」的下拉選單選項
        buildDynamicFilters();

        // 執行前端渲染與過濾
        applyAttendanceFilters();

    } catch (err) {
        console.error("讀取出席紀錄失敗:", err);
        $('#attendance-list').html(`
            <tr>
                <td colspan="6" class="text-center text-danger py-4">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>讀取資料時發生錯誤：${err.message}
                </td>
            </tr>
        `);
    }
}

/**
 * 3. 動態建置年份、月份與組別選單（從現有資料中不重複收集）
 */
function buildDynamicFilters() {
    const yearsSet = new Set();
    const monthsSet = new Set(); // 存放 MM 格式
    const groupsSet = new Set();

    rawAttendanceData.forEach(item => {
        const member = item.members || {};
        const activity = item.activities || {};

        // 收集年份與月份 (從活動日期 YYYY-MM-DD 拆解)
        if (activity.activity_date) {
            const parts = activity.activity_date.split('-'); // ["2026", "06", "10"]
            if (parts[0]) yearsSet.add(parts[0]);
            if (parts[1]) monthsSet.add(parts[1]);
        }

        // 收集組別 (排除 null / undefined)
        if (member.group_number !== null && member.group_number !== undefined) {
            groupsSet.add(member.group_number);
        }
    });

    // A. 渲染年份下拉選單 (由大到小排序)
    const sortedYears = Array.from(yearsSet).sort((a, b) => b - a);
    let yearHtml = '<option value="all">全部年份</option>';
    sortedYears.forEach(y => { yearHtml += `<option value="${y}">${y} 年</option>`; });
    $('#attendance-year-filter').html(yearHtml);

    // 【新增】取得今年年份並設定為預設查詢條件
    const currentYear = new Date().getFullYear().toString();
    
    // 檢查現有資料中是否有今年，若沒有則額外補上選項，確保預設能選到今年
    if (!yearsSet.has(currentYear)) {
        $('#attendance-year-filter').append(`<option value="${currentYear}">${currentYear} 年</option>`);
    }
    // 設定下拉選單預設值為今年
    $('#attendance-year-filter').val(currentYear);

    // B. 渲染月份下拉選單 (固定 01 ~ 12 月)
    let monthHtml = '<option value="all">全部月份</option>';
    for (let m = 1; m <= 12; m++) {
        const mStr = String(m).padStart(2, '0');
        monthHtml += `<option value="${mStr}">${m} 月</option>`;
    }
    $('#attendance-month-filter').html(monthHtml);

    // C. 渲染組別下拉選單 (由小到大排序)
    const sortedGroups = Array.from(groupsSet).sort((a, b) => a - b);
    let groupHtml = '<option value="all">全部組別</option>';
    sortedGroups.forEach(g => {
        let gName = (typeof groupMap !== 'undefined' && groupMap.has(String(g)))
            ? groupMap.get(String(g))
            : g + '組';
        groupHtml += `<option value="${g}">${gName}</option>`;
    });
    $('#attendance-group-filter').html(groupHtml);
}

/**
 * 4. 複合四條件過濾 (關鍵字 + 年份 + 月份 + 組別) 與統計計算
 */
function applyAttendanceFilters() {
    const keyword = $('#attendance-search').val().trim().toLowerCase();
    const selectedYear = $('#attendance-year-filter').val();
    const selectedMonth = $('#attendance-month-filter').val();
    const selectedGroup = $('#attendance-group-filter').val();

    // 進行多條件前端交叉篩選
    let filtered = rawAttendanceData.filter(item => {
        const member = item.members || {};
        const activity = item.activities || {};
        
        // A. 年份過濾
        if (selectedYear !== 'all' && activity.activity_date) {
            if (!activity.activity_date.startsWith(selectedYear)) return false;
        }

        // B. 月份過濾 (檢查活動日期 YYYY-MM-DD 的 MM 部分)
        if (selectedMonth !== 'all' && activity.activity_date) {
            const parts = activity.activity_date.split('-');
            if (parts[1] !== selectedMonth) return false;
        }

        // C. 組別過濾
        if (selectedGroup !== 'all') {
            if (String(member.group_number) !== selectedGroup) return false;
        }

        // D. 關鍵字搜尋 (比對姓名、組別、活動名稱、備註)
        if (keyword) {
            const name = (member.name || '').toLowerCase();
            const group = String(member.group_number || '');
            const title = (activity.title || '').toLowerCase();
            const notes = (item.notes || '').toLowerCase();
            
            if (!name.includes(keyword) && !group.includes(keyword) && !title.includes(keyword) && !notes.includes(keyword)) {
                return false;
            }
        }
        return true;
    });

    // 5. 更新上方儀表板統計數據
    const totalExpected = filtered.length;
    const attendedCount = filtered.filter(i => i.status === '出席' || i.status === 'Attended' || i.status === 'Present').length;
    const absentCount = totalExpected - attendedCount;
    const rate = totalExpected > 0 ? Math.round((attendedCount / totalExpected) * 100) : 0;

    $('#stat-total-expected').text(totalExpected);
    $('#stat-actual-attended').html(`${attendedCount} <span class="fs-6 fw-normal text-muted">(${rate}%)</span>`);
    $('#stat-total-absent').text(absentCount);

    // 6. 開始渲染 HTML 表格
    if (filtered.length === 0) {
        $('#attendance-list').html(`<tr><td colspan="6" class="text-center text-muted py-4">查無符合條件的出席紀錄</td></tr>`);
        return;
    }

    let html = '';
    $.each(filtered, function(index, item) {
        const member = item.members || {};
        const activity = item.activities || {};

        // 轉換組別文字顯示
        let displayGroup = '-';
        if (member.group_number !== null && member.group_number !== undefined) {
            displayGroup = (typeof groupMap !== 'undefined' && groupMap.has(String(member.group_number)))
                ? groupMap.get(String(member.group_number))
                : member.group_number + '組';
        }

        // 依據 status 狀態顯示 Badge
        let statusBadge = '';
        const statusStr = item.status || 'Registered';
        if (statusStr === '出席' || statusStr === 'Attended' || statusStr === 'Present') {
            statusBadge = `<span class="badge bg-success-subtle text-success border border-success-subtle">準時出席</span>`;
        } else if (statusStr === '請假' || statusStr === 'Leave') {
            statusBadge = `<span class="badge bg-warning-subtle text-warning border border-warning-subtle">請假</span>`;
        } else if (statusStr === 'Registered') {
            statusBadge = `<span class="badge bg-info-subtle text-info border border-info-subtle">已報名</span>`;
        } else {
            statusBadge = `<span class="badge bg-danger-subtle text-danger border border-danger-subtle">缺席</span>`;
        }

        const displayActivity = activity.title ? `${activity.title} <small class="text-muted">(${activity.activity_date || ''})</small>` : '-';
        const displayCheckIn = item.created_at ? new Date(item.created_at).toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit'}) : '-';

        html += `
            <tr>
                <td><strong>${member.name || '-'}</strong></td>
                <td>${displayGroup}</td>
                <td>${displayActivity}</td>
                <td>${statusBadge}</td>
                <td class="text-muted small">${item.notes || '-'}</td>
            </tr>
        `;
    });

    $('#attendance-list').html(html);
}

/**
 * 5. 匯出目前表格內過濾好的出席報表 CSV (同步支援全新篩選結果)
 */
function exportAttendanceCsv() {
    if (rawAttendanceData.length === 0) return alert("目前沒有數據可供匯出");
    
    let csvContent = "\uFEFF"; // 解決 Excel 中文亂碼 (BOM)
    csvContent += "姓名,組別,活動資訊,時間,狀態,備註\n";

    $('#attendance-list tr').each(function() {
        let rowData = [];
        $(this).find('td').each(function() {
            let text = $(this).text().trim().replace(/"/g, '""');
            rowData.push(`"${text}"`);
        });
        if (rowData.length > 0) {
            csvContent += rowData.join(",") + "\n";
        }
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `出席紀錄報表_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
